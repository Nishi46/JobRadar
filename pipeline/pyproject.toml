[project]
name = "jobradar"
version = "0.1.0"
description = "AI Job Radar pipeline: ingestion workers, extraction and API"
requires-python = ">=3.12"
# Runtime dependencies are added in the milestone that first uses them.
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear: likely bugs
  "UP",  # pyupgrade: modern syntax
  "SIM", # simplifications
  "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
